services:
  backend:
    build: .
    ports:
      - "3000:3000"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}"
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3000
      REDIS_URL: "redis://redis:6379"

    command: sh -c "npm run prisma:migrate:deploy && npm run start"

  postgres:
    image: postgres:17

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:latest

    ports:
      - "6379:6379"

volumes:
  postgres_data: